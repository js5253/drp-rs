[package]
name = "drp"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
axum = { version = "0.6.20", features = ["macros", "json"] }
config = { version = "0.13.3", features = ["toml"] }
discord-rich-presence = "0.2.3"
futures = "0.3.29"
lazy_static = "1.4.0"
reqwest = { version = "0.11.22", features = ["blocking", "serde_json", "cookies", "json"] }
serde = { version = "1.0.188", features = ["derive"] }
serde-aux = "4.2.0"
tokio = { version = "1.33.0", features = ["macros"] }
urlencoding = "2.1.3"
fltk = { version = "1.4.20", features = ["fltk-bundled"] }
toml = "0.8.8"

[target.'cfg(linux)'.dependencies]
mpris = "2.0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.51.1", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Foundation"] }


cacao = "0.3.2"

[profile.release]
strip = "symbols"
opt-level="z"
